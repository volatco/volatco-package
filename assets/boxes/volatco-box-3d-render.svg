<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Volatco Folded Box 3D Approximate Render</title>
  <desc id="desc">Approximate 3D render of a folded Volatco retail box using Cartheur logo colors.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f1"/>
      <stop offset="100%" stop-color="#dbe7e2"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18d493"/>
      <stop offset="100%" stop-color="#0da170"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="610" cy="706" rx="320" ry="58" fill="#6c7a74" opacity="0.32"/>

  <g filter="url(#shadow)">
    <polygon points="330,230 780,170 915,278 465,338" fill="url(#top)"/>
    <polygon points="780,170 915,278 915,630 780,540" fill="url(#side)"/>
    <polygon points="330,230 780,170 780,540 330,605" fill="url(#front)"/>

    <polyline points="330,230 780,170 915,278" fill="none" stroke="#73ffd0" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="780" y1="170" x2="780" y2="540" stroke="#73ffd0" stroke-opacity="0.35" stroke-width="2"/>

    <text x="612" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#f7fffc" letter-spacing="2">VOLATCO</text>
    <text x="612" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#20f8a8">Powerful Multicompute</text>
    <image href="./cartheur-logo.jpg" x="740" y="196" width="56" height="56"/>

    <text x="555" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#052016" letter-spacing="3">VOLATCO</text>
    <text x="555" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0a3526">VOL00 / VOL01 / VOLxx</text>
    <image href="./cartheur-logo.jpg" x="368" y="252" width="88" height="88"/>

    <rect x="388" y="454" width="334" height="118" rx="12" fill="#101010" fill-opacity="0.30" stroke="#20f8a8" stroke-opacity="0.65"/>
    <text x="412" y="494" font-family="Arial, sans-serif" font-size="22" fill="#f4fff9">68 x 48 x 23 mm internal</text>
    <text x="412" y="528" font-family="Arial, sans-serif" font-size="22" fill="#f4fff9">3 mm anti-static bubble wrap</text>

    <text x="850" y="436" transform="rotate(90 850 436)" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#7fffd5" letter-spacing="2">VOLATCO</text>
  </g>

  <text x="600" y="840" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#0f3b2a">Approximate visual render for packaging preview</text>
</svg>
