<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>Rigid Box Wrap Template - 2.0mm Greyboard</title>
  <desc>A4 print template with bleed, trim, and turn-in guides for base and lid wraps.</desc>
  <style>
    .page { fill: #ffffff; }
    .bleed { fill: none; stroke: #ef4444; stroke-width: 0.25; }
    .trim { fill: none; stroke: #111827; stroke-width: 0.25; }
    .fold { fill: none; stroke: #2563eb; stroke-width: 0.2; stroke-dasharray: 1.5 1.5; }
    .panel { fill: none; stroke: #16a34a; stroke-width: 0.25; }
    .txt { fill: #111827; font-family: Arial, sans-serif; font-size: 3.2px; }
    .small { fill: #374151; font-family: Arial, sans-serif; font-size: 2.6px; }
  </style>

  <rect class="page" x="0" y="0" width="210" height="297"/>

  <!-- BASE: trim 156 x 136, bleed 162 x 142, panel 72 x 52 -->
  <g transform="translate(20,20)">
    <text class="txt" x="0" y="-3">BASE WRAP - 2.0mm board</text>
    <text class="small" x="0" y="1">Bleed: 162 x 142 mm | Trim: 156 x 136 mm | Board outer panel: 72 x 52 mm</text>

    <rect class="bleed" x="0" y="6" width="162" height="142"/>
    <rect class="trim" x="3" y="9" width="156" height="136"/>
    <rect class="fold" x="18" y="24" width="126" height="106"/>
    <rect class="panel" x="45" y="51" width="72" height="52"/>

    <text class="small" x="45.5" y="49">Board panel</text>
  </g>

  <!-- LID: trim 144 x 124, bleed 150 x 130, panel 74 x 54 -->
  <g transform="translate(20,165)">
    <text class="txt" x="0" y="-3">LID WRAP - 2.0mm board</text>
    <text class="small" x="0" y="1">Bleed: 150 x 130 mm | Trim: 144 x 124 mm | Lid top panel: 74 x 54 mm</text>

    <rect class="bleed" x="0" y="6" width="150" height="130"/>
    <rect class="trim" x="3" y="9" width="144" height="124"/>
    <rect class="fold" x="18" y="24" width="114" height="94"/>
    <rect class="panel" x="38" y="44" width="74" height="54"/>

    <text class="small" x="38.5" y="42">Lid top panel</text>
  </g>

  <text class="txt" x="20" y="289">Print at 100% scale on A4. Disable fit-to-page.</text>
  <text class="small" x="20" y="293">Red=bleed cut area, black=trim cut line, blue dashed=fold/turn-in guides, green=centered board panel.</text>
</svg>
